<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistiques — Séries</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3e;
      --accent:   #6c8eff;
      --accent2:  #a78bfa;
      --text:     #e2e4f0;
      --muted:    #6b7280;
      --success:  #34d399;
      --warn:     #fbbf24;
      --error:    #f87171;
      --radius:   10px;
      --mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      max-width: 860px;
      margin: 0 auto 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    header p {
      margin-top: .35rem;
      color: var(--muted);
      font-size: .875rem;
    }

    main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .card h2 {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    /* ── Checkboxes ── */
    .series-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
    }
    .serie-chip {
      display: flex;
      align-items: center;
      gap: .45rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .4rem .75rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
      font-size: .875rem;
    }
    .serie-chip:hover { border-color: var(--accent); }
    .serie-chip input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
    .serie-chip.checked { border-color: var(--accent); background: rgba(108,142,255,.08); }

    /* ── Selects pour corrélation ── */
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: .4rem; flex: 1; min-width: 140px; }
    .field label { font-size: .75rem; color: var(--muted); font-weight: 500; }
    .field select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: .5rem .75rem;
      font-size: .875rem;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }
    .field select:focus { border-color: var(--accent); }

    /* ── Boutons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1.1rem;
      border-radius: 7px;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .actions { display: flex; gap: .75rem; margin-top: 1.1rem; align-items: center; }

    /* ── Résultats JSON ── */
    #results { display: flex; flex-direction: column; gap: 1rem; }

    .result-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .65rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: .8rem;
    }
    .result-header .tag {
      font-weight: 700;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: .2rem .5rem;
      border-radius: 4px;
    }
    .tag-describe  { background: rgba(108,142,255,.15); color: var(--accent); }
    .tag-corr      { background: rgba(167,139,250,.15); color: var(--accent2); }
    .tag-error     { background: rgba(248,113,113,.15); color: var(--error); }
    .result-header .serie-name { color: var(--text); font-weight: 500; }
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: .72rem;
      padding: .2rem .55rem;
      border-radius: 5px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--accent); }

    pre {
      font-family: var(--mono);
      font-size: .8rem;
      line-height: 1.6;
      padding: 1rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* JSON syntax colors */
    .json-key    { color: var(--accent); }
    .json-str    { color: var(--success); }
    .json-num    { color: var(--warn); }
    .json-bool   { color: var(--accent2); }
    .json-null   { color: var(--muted); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: .875rem;
    }
    .empty-state svg { margin-bottom: .75rem; opacity: .3; }
  </style>
</head>
<body>

<header>
  <h1>Explorateur de séries</h1>
  <p>Interrogez la base MySQL et visualisez les statistiques en JSON.</p>
</header>

<main>

  <!-- ── Describe ── -->
  <div class="card">
    <h2>Statistiques descriptives</h2>
    <div class="series-grid" id="checkboxes">
      {% for s in series %}
      <label class="serie-chip" id="chip-{{ s }}">
        <input type="checkbox" name="serie" value="{{ s }}" onchange="toggleChip(this)">
        {{ s }}
      </label>
      {% endfor %}
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="runDescribe()">
        <span>Analyser</span>
        <div class="spinner" id="spin-describe"></div>
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">Effacer</button>
    </div>
  </div>

  <!-- ── Corrélation ── -->
  <div class="card">
    <h2>Corrélation de Pearson</h2>
    <div class="row">
      <div class="field">
        <label>Série X</label>
        <select id="sel-x">
          {% for s in series %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Série Y</label>
        <select id="sel-y">
          {% for s in series %}
          <option value="{{ s }}" {% if loop.index == 2 %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="runCorrelation()">
        <span>Calculer</span>
        <div class="spinner" id="spin-corr"></div>
      </button>
    </div>
  </div>

  <!-- ── Résultats ── -->
  <div class="card">
    <h2>Résultats JSON</h2>
    <div id="results">
      <div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="16" y2="17"/>
        </svg>
        <p>Aucun résultat pour l'instant.<br>Sélectionnez des séries et lancez une analyse.</p>
      </div>
    </div>
  </div>

</main>

<script>
  function toggleChip(checkbox) {
    const chip = checkbox.closest('.serie-chip');
    chip.classList.toggle('checked', checkbox.checked);
  }

  function syntaxHighlight(json) {
    return JSON.stringify(json, null, 2)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
        if (/^"/.test(match)) {
          return match.endsWith(':')
            ? `<span class="json-key">${match}</span>`
            : `<span class="json-str">${match}</span>`;
        }
        if (/true|false/.test(match)) return `<span class="json-bool">${match}</span>`;
        if (/null/.test(match))       return `<span class="json-null">${match}</span>`;
        return `<span class="json-num">${match}</span>`;
      });
  }

  function addResult(tag, tagClass, title, data) {
    const container = document.getElementById('results');
    // Retire l'état vide au premier résultat
    const empty = container.querySelector('.empty-state');
    if (empty) empty.remove();

    const id = `result-${Date.now()}`;
    const block = document.createElement('div');
    block.className = 'result-block';
    block.innerHTML = `
      <div class="result-header">
        <div style="display:flex;align-items:center;gap:.6rem">
          <span class="tag ${tagClass}">${tag}</span>
          <span class="serie-name">${title}</span>
        </div>
        <button class="copy-btn" onclick="copyJson('${id}')">Copier</button>
      </div>
      <pre id="${id}">${syntaxHighlight(data)}</pre>
    `;
    container.prepend(block);
  }

  function copyJson(id) {
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector(`[onclick="copyJson('${id}')"]`);
      const orig = btn.textContent;
      btn.textContent = 'Copié ✓';
      setTimeout(() => btn.textContent = orig, 1500);
    });
  }

  function setLoading(spinnerId, btnEl, loading) {
    const spinner = document.getElementById(spinnerId);
    spinner.style.display = loading ? 'block' : 'none';
    btnEl.disabled = loading;
  }

  async function runDescribe() {
    const checked = [...document.querySelectorAll('input[name="serie"]:checked')];
    if (!checked.length) { alert('Sélectionnez au moins une série.'); return; }

    const btn = event.currentTarget;
    setLoading('spin-describe', btn, true);

    const params = checked.map(c => `serie=${encodeURIComponent(c.value)}`).join('&');
    try {
      const res  = await fetch(`/ui/stats/describe?${params}`);
      const data = await res.json();
      if (data.resultats) {
        for (const [serie, result] of Object.entries(data.resultats)) {
          const isError = !!result.erreur;
          addResult(
            isError ? 'Erreur' : 'Describe',
            isError ? 'tag-error' : 'tag-describe',
            serie,
            result
          );
        }
      } else {
        addResult('Erreur', 'tag-error', 'describe', data);
      }
    } catch (e) {
      addResult('Erreur', 'tag-error', 'réseau', { erreur: e.message });
    } finally {
      setLoading('spin-describe', btn, false);
    }
  }

  async function runCorrelation() {
    const x = document.getElementById('sel-x').value;
    const y = document.getElementById('sel-y').value;

    const btn = event.currentTarget;
    setLoading('spin-corr', btn, true);

    try {
      const res  = await fetch(`/ui/stats/correlation?serie_x=${encodeURIComponent(x)}&serie_y=${encodeURIComponent(y)}`);
      const data = await res.json();
      const isError = !!data.erreur;
      addResult(
        isError ? 'Erreur' : 'Corrélation',
        isError ? 'tag-error' : 'tag-corr',
        `${x} × ${y}`,
        data
      );
    } catch (e) {
      addResult('Erreur', 'tag-error', 'réseau', { erreur: e.message });
    } finally {
      setLoading('spin-corr', btn, false);
    }
  }

  function clearAll() {
    const container = document.getElementById('results');
    container.innerHTML = `
      <div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="16" y2="17"/>
        </svg>
        <p>Aucun résultat pour l'instant.<br>Sélectionnez des séries et lancez une analyse.</p>
      </div>`;
    document.querySelectorAll('input[name="serie"]').forEach(c => {
      c.checked = false;
      c.closest('.serie-chip').classList.remove('checked');
    });
  }
</script>
</body>
</html>
